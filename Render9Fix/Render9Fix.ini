; Render9Fix.ini —— 配置（可选；没有这个文件时全部用下面的默认值）
;
; 放在 Render9Fix.asi 同目录（如 update\）或游戏根目录都能读到；两处都有时以 asi 同目录优先。
;
; ---------------------------------------------------------------------------
; 这个插件干什么：把 dxrender9.dll 发起的「小对象」分配导向 2GB 以下的低地址。
;
; 为什么：LAA 打开后引擎内存池抬到 0x83xxxxxx（>=2GB），而 dxrender9 里静态链接的
; D3DX（2006 年代码）在 >=2GB 的地址上会出错 —— effect 的 GetTechnique(0) 返回无效
; 句柄，technique 全部验证失败被跳过，计数变 0，随后取 techArr[0]（NULL）崩溃在
; dxrender9+0x416D6。把 dxrender9 的小对象放回 2GB 以下即恢复它能正确处理的环境。
; ---------------------------------------------------------------------------

[Render9Fix]

; 总开关。0 = 什么都不做（完全不干预游戏）
Enabled=1

; 只导向「大小 <= SizeMax」的分配，单位字节。
; data\shaders 下最大的 fx 只有 9686 字节，D3DX 的 effect 内部结构也就几百字节到几 KB，
; 默认 64KB 足够覆盖，且低地址池占用极小。
; ★ 如果日志里「高地址遗留」条数很大，把这个值调大再试（最大 65536）。
SizeMax=65536

; 1 = 只处理 dxrender9.dll 发起的分配（推荐）
; 0 = 处理所有模块的分配（不建议：会把纹理/顶点缓冲等大块也拖进低地址，
;     既浪费 2GB 以下的空间，也失去 LAA 的意义）
OnlyDxRender9=1

; 低地址池预留多少 MB（1..512）。只预留不提交，按需提交，所以实际占用远小于这个数。
ArenaMB=32

; 低地址池首选基址（十六进制）。失败会自动依次尝试 0x58/50/48/44/40/38/30/28/20/70/18 开头的地址。
ArenaBase=60000000

; 1 = 记录每一笔导向和每一笔高地址遗留（排查用，日志会很大）
; 0 = 只记录前若干笔作为样本
LogAlloc=0

; 最多等多少秒让 hta.exe 构造出 Kernel 对象。超时就什么都不做（游戏不受影响）。
WaitSec=60
