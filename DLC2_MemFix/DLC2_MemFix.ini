; DLC2_MemFix.ini —— 配置（可选；没有这个文件时全部用下面的默认值）
;
; 放在 DLC2_MemFix.asi 同目录（如 update\）或游戏根目录都能读到；两处都有时以 asi 同目录优先。
;
; ---------------------------------------------------------------------------
; 这个插件干什么：把引擎分配器（Kernel+0x30 AllocMem）返回的「>=2GB 小对象」
; 重导向到 2GB 以下的低地址池。
;
; 为什么：emarcade.exe 把渲染器（含 2006 年代的 D3DX）静态链接进 exe，
; 那段老代码在 >=2GB 的地址上会出错 —— road.fx 的 GetTechnique(0) 返回无效句柄，
; technique 全部验证失败被跳过，计数变 0，随后 read [0]（ESI=0）崩溃。
;
;   注：这条链路在 Meridian113.exe（DLC1）上有实机崩溃转储 + 引擎日志
;   （Kernel.cpp[0317] EffectImpl ... road.fx）取证，本体 hta.exe 上被
;   Render9Fix 证实并修好。**emarcade 自己还没有崩溃转储** ——
;   「根因就是 >=2GB 地址」在这里是**工作假设**。
;   本插件会在日志里给出「导向 / 高地址遗留」的笔数，用数据验证或推翻它。
;
; 当前状态：emarcade.exe 的 PE Characteristics = 0x10E，**没有 LAA 位**
; （Meridian113.exe 是 0x12E）。所以未打 4GB 补丁时本插件恒为「无害空转」
; （addr < 0x80000000 永不成立），游戏完全不受影响；打了补丁才开始起作用。
; ---------------------------------------------------------------------------

[DLC2_MemFix]

; 总开关。0 = 什么都不做（完全不干预游戏）
Enabled=1

; 只有「大小 <= SizeMax」的分配才会被导向。
; data\shaders 下最大的 fx 只有 9686 字节，D3DX/effect 内部结构也就几百字节到几 KB，
; 默认 64KB 足够覆盖，且低地址池占用极小。
; ★ 如果日志里「高地址遗留」笔数很大，把这个值调大再试（最大 65536）。
SizeMax=65536

; 保留项（语义固定为「只导向 >=2GB 的返回」，设 0 也不会去动 <2GB 的分配）
OnlyHighAddr=1

; 低地址池预留多少 MB（1..512）。只预留不提交，按需提交，实际占用远小于这个数。
; ★ v1 用 32MB，实测在世界加载前就耗尽（提交 33554432/33554432）⇒ 之后一笔都导向不了。
;   现在默认 256MB。
ArenaMB=256

; 低地址池首选基址（十六进制）。失败会自动依次尝试其它候选。
ArenaBase=60000000

; 1 = 记录每一笔导向和每一笔高地址遗留（排查用，日志会很大）
; 0 = 只记录前若干笔作为样本
LogAlloc=0

; 最多等多少秒让引擎构造出 Kernel 对象。超时就什么都不做（游戏不受影响）。
WaitSec=120
