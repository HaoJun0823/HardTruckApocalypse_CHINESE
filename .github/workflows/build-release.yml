name: build-release

# ══════════════════════════════════════════════════════════════════════════
# 三个游戏的简体中文汉化包 —— 构建 + 自动发 Release
# ══════════════════════════════════════════════════════════════════════════
# 产物：三个可直接解压到游戏根目录的 zip
#   燃烧飞车_末日浩劫_简体中文汉化_<date>.zip               → 本体 hta.exe
#   燃烧飞车_末日浩劫_部落崛起_简体中文汉化_<date>.zip      → 资料片 Meridian113.exe
#   燃烧飞车_末日浩劫_街机版_简体中文汉化_<date>.zip        → 街机版 emarcade.exe
#
# 三套包不能合并：三个 exe 的补丁锚点地址互不相同（详见
# docs/2026-10-08-资料片113汉化移植与LAA崩溃修复.md 的锚点对照表）。
#
# ── 流程（10 步）────────────────────────────────────────────────────────
#   1. 检出仓库 + msvc-wine；装 wine64/msitools/ca-certificates/winbind
#   2. 装 MSVC v141(14.16) + Win10 SDK 26100（分段下载后合并；带缓存）
#   3. 编译 6 个插件 DLL      → tools/release/compile_dlls.sh（含体积闸门）
#   4. 给 wine 配 texconv 需要的 4 个 VC141 运行库（msvcp140/vcruntime140/
#      vcruntime140_1/vcomp140），使其能在 wine 下运行
#   5. 烘三套字库 → fontgen/build_cjk.py ×3
#      （按译文 XML 动态收集汉字 → 生成 cjk_*.dds 图集 + fonts.xml + .bin）
#   6. 装 Pillow（烘焙脚本依赖）
#   7. 装配三个发布包 → tools/release/build_release.py
#   8. 校验：结构 + DLL 体积指纹 + 与参考包逐文件哈希比对（可选）
#   9. 上传三个 artifact
#  10. publish job：同 run 内按日期-时间打 tag 并发布 Release
#
# ── 为什么是 ubuntu-latest + msvc-wine ──────────────────────────────────
#   windows-2022/2025 镜像**不带 v141 (MSVC 14.16)**，构建会静默回退到新版
#   工具集（产物体积随之改变）。本仓库的 6 个 DLL 都有历史确认的体积指纹，
#   回退会被 compile_dlls.sh 的闸门拦下。改用 msvc-wine：从微软 CDN 按官方
#   manifest 精确拉 VS2017 15.9 的 VC.Tools.14.16，用 wine 跑真 cl/link。
#   这条路线取自同作者的 SR_GAME_CHINESE / MajestyIExtend / MajestyIIExtend。
#
# ── 触发 ────────────────────────────────────────────────────────────────
#   push(master/main) → 构建 + 校验 + artifact；publish job 同 run 内发 Release
#   pull_request      → 构建 + 校验（门禁，不发布）
#   workflow_dispatch → 手动；可勾选跳过 DLL 编译（复用已有产物，CI 上别勾）
#
# ★ 不用「tag push 重触发 workflow」发版：GITHUB_TOKEN 推的 tag 不触发
#   on:push（GitHub 防循环），发布一律在同一 run 内由 publish job 完成。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'archives/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'archives/**'
  workflow_dispatch:
    inputs:
      skip_dll:
        description: '跳过 DLL 编译（复用仓库内已有产物；CI 上一般不要勾）'
        type: boolean
        default: false

permissions:
  contents: read

# 同一分支/PR 的新推送取消旧的进行中构建，省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建三个汉化包（ubuntu-latest + msvc-wine MSVC v141 x86）
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      # msvc-wine 安装目录（VC 14.16 + 合并进来的 SDK 26100）。
      MSVC_WINE_PREFIX: ${{ github.workspace }}/.msvc
      # SDK 26100 的独立下载目录（下完 mv 合并进 MSVC_WINE_PREFIX）
      MSVC_SDK_DIR: ${{ github.workspace }}/.msvc-sdk
      # msvc-wine 上游 checkout 的 ref。升级时改这里 —— cache key 含它。
      MSVCWINE_REF: master
      # ★ HTA_TEXCONV（给 fontgen/build_cjk.py 指定 wine 命令前缀）**不在这里设**：
      #   wine 的可执行名随发行版而异（wine64 / wine），必须在「安装 wine」那一步
      #   探测出来再写进 $GITHUB_ENV。job 级 env 在这之前就求值了，没法引用。
      #   详见「安装 wine / 解析 wine 可执行名」步骤。

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # ★ 必须完整 checkout msvc-wine（不能只下 vsdownload.py）：
      #   install.sh 要用仓库里的 lowercase / fixinclude（Linux 大小写修复）、
      #   wrappers/（cl/link 包装脚本）、msvctricks.cpp（自举实测 cl 可用）。
      - name: 检出 msvc-wine
        uses: actions/checkout@v5
        with:
          repository: mstorsjo/msvc-wine
          ref: ${{ env.MSVCWINE_REF }}
          path: .msvc-wine

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── wine 侧依赖（msvc-wine README 的 Prerequisites）──────────────
      #   wine64 : 跑真 cl.exe/link.exe，以及 fontgen/texconv.exe
      #   msitools: msiextract，解 VS 组件与 WinSDK 的 .msi
      #   winbind : cl 用 /Zi 时 mspdbsrv 的命名管道通信需要（本流程用 /Z7
      #             绕开了它，但装上更保险）
      - name: 安装 wine / msitools 等依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wine msitools ca-certificates winbind

          # ── 解析 wine 可执行名并导出 HTA_TEXCONV ──────────────────────
          #   wine / wine64 的可用性随发行版与版本而变，统一探测一次，
          #   后面所有步骤（含 build_cjk.py 的子进程）都用这个结果。
          #   ★ 写进 $GITHUB_ENV，后续步骤才看得到。
          if command -v wine >/dev/null 2>&1; then
            WINE_BIN=wine
          elif command -v wine64 >/dev/null 2>&1; then
            WINE_BIN=wine64
          else
            echo "!! 既没有 wine 也没有 wine64" >&2; exit 1
          fi
          echo "使用 wine 可执行: $WINE_BIN"
          "$WINE_BIN" --version
          # 让 build_cjk.py 用该 wine 跑 Windows 版 texconv.exe
          # （不设此变量时脚本直接执行 texconv，即本机 Windows 的行为）
          echo "HTA_TEXCONV=$WINE_BIN ${GITHUB_WORKSPACE}/fontgen/texconv.exe" >> "$GITHUB_ENV"
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"

      # ── Python 依赖：烘焙脚本需要 Pillow ─────────────────────────────
      - name: 安装 Python 依赖（Pillow）
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow
          python -c "import PIL; print('Pillow', PIL.__version__)"

      # ── MSVC 工具链缓存 ──────────────────────────────────────────────
      - name: 还原 MSVC 工具链缓存
        uses: actions/cache@v5
        with:
          path: .msvc
          key: hta-msvcwine-v141-x86-sdk26100-${{ env.MSVCWINE_REF }}-v1

      # ── 下载工具链（缓存未命中时）：两段 vsdownload + 合并 ───────────
      #   ★ 段 1（VC 14.16）：--major 15 是关键 —— VC.Tools.14.16（v141）只
      #     存在于 VS2017 manifest；VS2022+ 的 ID 不同，vsdownload 找不到会
      #     **静默回退最新工具集**，产物体积随之变化。
      #   ★ --architecture **x86 x64**（两者都要）：x86 cl.exe 启动时按 PATH
      #     找 mspdbcore.dll，而 VC 14.16 里它只在 Hostx64/x64 目录。只拉 x86
      #     会让 cl 报 "fatal error C1356"。
      #   ★ 段 2（SDK 26100）：144384 等体积指纹是「14.16 + 这组 flags +
      #     SDK 26100」的确定产物，必须锁 26100（VS2017 manifest 里没有它，
      #     故单独从 VS2022 channel 拉）。
      - name: 下载并装配 MSVC v141 + Win10 SDK 26100（缓存未命中时）
        run: |
          set -euo pipefail
          if [ -x "${MSVC_WINE_PREFIX}/bin/x86/cl" ] && \
             [ -d "${MSVC_WINE_PREFIX}/kits/10/include/10.0.26100.0" ]; then
            echo "工具链缓存命中（VC 14.16 + SDK 26100），跳过下载。"
          else
            echo "==> [1/3] 下载 VC 14.16 (v141, VS2017 channel, x86+x64)"
            python3 .msvc-wine/vsdownload.py \
              --accept-license --major 15 --msvc-version 15.9 \
              --architecture x86 x64 --host-arch x64 \
              --with-sdk=no --with-atl=no --with-asan=no --with-dia=no \
              --with-msbuild=no --with-devcmd=no \
              --dest "${MSVC_WINE_PREFIX}"

            echo "==> [2/3] 下载 Win10 SDK 26100 (VS2022 channel)"
            python3 .msvc-wine/vsdownload.py \
              --accept-license --major 17 \
              --sdk-version 10.0.26100 \
              --with-default=no \
              --architecture x86 --host-arch x64 \
              --dest "${MSVC_SDK_DIR}"

            echo "==> [3/3] 合并 SDK 26100 进 MSVC prefix"
            if [ -d "${MSVC_WINE_PREFIX}/Windows Kits" ]; then
              echo "!! .msvc/Windows Kits 已存在，意外状态" >&2; exit 1
            fi
            mv "${MSVC_SDK_DIR}/Windows Kits" "${MSVC_WINE_PREFIX}/"
          fi
          rm -rf "${MSVC_SDK_DIR}"

      # ── install.sh：大小写修复 + 包装脚本生成（幂等，永远跑）────────
      - name: install.sh（生成包装脚本 / 大小写修复）
        run: |
          set -euo pipefail
          sh .msvc-wine/install.sh "${MSVC_WINE_PREFIX}"

      # ── 编译器验证（门禁 + 诊断）────────────────────────────────────
      - name: 验证编译器为 MSVC v141 x86（诊断 + 门禁）
        run: |
          set -euo pipefail
          export PATH="${MSVC_WINE_PREFIX}/bin/x86:$PATH"
          echo "── mspdbcore.dll 就位检查（C1356 根因诊断）──"
          find "${MSVC_WINE_PREFIX}/vc/tools/msvc" -name mspdbcore.dll 2>/dev/null || true
          echo "── cl banner ──"
          banner="$(cl 2>&1 || true)"
          echo "$banner" | head -2
          if ! echo "$banner" | grep -q "19\.16"; then
            echo "!! cl 不是 MSVC 14.16 (v141) —— vsdownload 可能回退了版本" >&2
            exit 1
          fi
          echo "── Win SDK 版本（应只有 10.0.26100.0）──"
          ls "${MSVC_WINE_PREFIX}/kits/10/include/"
          echo "── 磁盘余量 ──"
          df -h .

      # ── 编译 6 个插件 DLL ───────────────────────────────────────────
      #   脚本内含**体积指纹闸门**（178176/178176/195584/144384/140800/140288），
      #   工具链或 flags 任一回退都会当场失败，绝不把错 DLL 发出去。
      #   ★ 必须用 `bash` 而不是 `sh` 调用：Ubuntu 上 /bin/sh 是 dash，它会
      #     **忽略脚本的 shebang**，于是 `set -o pipefail`（dash 不支持）和
      #     bash 数组语法都会失败。实测：`sh ...` 报
      #     "set: Illegal option -o pipefail"。
      - name: 编译 6 个插件 DLL
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        run: |
          set -euo pipefail
          bash tools/release/compile_dlls.sh

      # skip_dll=true 时直接复用仓库里已提交的构建产物（这些 build/Release/*.dll
      # 通常被 .gitignore 排除，故仅当你明确把它们提交进仓库后这条才有意义）。
      - name: 跳过 DLL 编译（复用已有产物）
        if: ${{ github.event.inputs.skip_dll == 'true' }}
        run: |
          set -euo pipefail
          echo ">> skip_dll=true：复用已有 DLL 产物"
          missing=0
          for p in \
            HardTruckApocalypse_CHINESE_DLL/build/Release/hta_chs.dll \
            HardTruckApocalypse_CHINESE_DLL_DLC1/build/Release/hta_chs_dlc1.dll \
            HardTruckApocalypse_CHINESE_DLL_DLC2/build/Release/hta_chs_dlc2.dll \
            Render9Fix/build/Release/Render9Fix.dll \
            DLC1_MemFix/build/Release/DLC1_MemFix.dll \
            DLC2_MemFix/build/Release/DLC2_MemFix.dll ; do
            if [ -f "$p" ]; then
              echo "  OK  $p ($(wc -c < "$p") B)"
            else
              echo "  !!  缺 $p" >&2; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "!! skip_dll=true 但仓库里没有全部 6 个产物；请去掉该勾选。" >&2
            exit 1
          fi

      # ── 为 wine 准备 texconv 所需的 VC 运行库 ───────────────────────
      # ★ texconv.exe 是 Windows 程序，导入 MSVCP140 / VCRUNTIME140 /
      #   VCRUNTIME140_1 / VCOMP140（OpenMP）。wine 对这些的**内置实现不完整**，
      #   必须把真 DLL 放到 exe 同一目录 —— Windows 的 DLL 搜索顺序里 exe
      #   同目录优先，wine 也遵循该顺序，于是会加载它们而不是内置版本。
      #
      # ★ 为什么把 DLL 存进仓库（dist/runtime-x64/），而不是 CI 里现下：
      #   这些 DLL 并不在 msvc-wine 下载的 VC 14.16 工具链里 —— 工具链的
      #   Hostx64/x64 只有 msvcp140 / vcruntime140 / msvcp140_1 / msvcp140_2，
      #   **没有 vcruntime140_1.dll**（它是 VS2019/14.20 才引入的）也没有
      #   vcomp140.dll（在 VC/Redist 的 OpenMP 组件里，而 vsdownload 不拉
      #   Redist）。先前版本想从 nuget 下 vc143 包补齐，但 nuget 上
      #   Microsoft.VC143.CRT / .OpenMP 这些包 ID 实际不存在（实测 404）。
      #   改为把 4 个 x64 DLL 直接入库（共 865 KB），与 winmm.dll 同样处理：
      #   不构建、直接分发，消除外网与包 ID 失效的风险。
      #
      # ★ 版本：14.29.30157（VC142）。MSVC 14.x 系列保持二进制向后兼容，
      #   14.29 运行库可以给 VS2017(14.16) 编出来的 texconv.exe 用 —— 本地
      #   用同一组 DLL 实测加载成功。
      - name: 为 wine 准备 texconv 运行库
        run: |
          set -euo pipefail
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll vcomp140.dll; do
            if [ ! -f "dist/runtime-x64/$f" ]; then
              echo "!! 缺少 dist/runtime-x64/$f" >&2; exit 1
            fi
            cp -v "dist/runtime-x64/$f" fontgen/
          done
          echo "── fontgen/ 下的运行库 ──"
          ls -la fontgen/*.dll

      # ── texconv 可用性自检（在烘焙之前拦住环境问题）─────────────────
      #   做法：让 texconv 把一张已存在的 dds 转成 png，成功即说明 wine +
      #   4 个运行库都就位。比等到 3 次烘焙跑了一半才失败要省 10 分钟。
      - name: 自检 texconv 能在 wine 下运行
        run: |
          set -euo pipefail
          # 用仓库里现成的图集当输入（任何一张 cjk 页都行；没有就跳过）
          sample="$(find Original_DATA -name '*.dds' | head -1)"
          if [ -z "$sample" ]; then
            echo "!! 仓库里找不到 .dds 供自检" >&2; exit 1
          fi
          echo "输入样例: $sample"
          echo "HTA_TEXCONV = ${HTA_TEXCONV:-<未设置>}"
          # 直接用 HTA_TEXCONV（含 wine 可执行名 + 绝对 exe 路径，不引号让 shell
          # 拆成 `wine /abs/texconv.exe` 两段）。输入/输出都用**相对路径**——wine
          # 下的 Windows 程序会把 Unix 绝对路径（/ 开头）当成命令行选项开关，
          # 表现为 `Unknown option: home/runner/...`（开头 / 被吞），而非找不到文件。
          rm -rf hta_texconv_selftest && mkdir -p hta_texconv_selftest
          set +e
          out="$($HTA_TEXCONV "$sample" \
                   -f R8G8B8A8_UNORM -ft png -o hta_texconv_selftest -y -nologo 2>&1)"
          rc=$?
          set -e
          echo "$out" | tail -20
          if [ $rc -ne 0 ] || ! ls hta_texconv_selftest/*.png >/dev/null 2>&1; then
            echo "!! texconv 在 wine 下不可用（rc=$rc）" >&2
            echo "   常见原因：缺 msvcp140/vcruntime140/vcruntime140_1/vcomp140，" >&2
            echo "            或 dist/runtime-x64/ 里的 DLL 没复制到 fontgen/" >&2
            exit 1
          fi
          echo "✓ texconv 可用：$(ls hta_texconv_selftest)"
          rm -rf hta_texconv_selftest

      # ── 烘焙三套字库 ────────────────────────────────────────────────
      #   每个包用自己的 fonts.xml 当源、自己的译文目录收集汉字：
      #     base → Original_DATA/fonts.xml   + Original_DATA_CHS/
      #     dlc1 → DLC1_DATA/fonts.xml       + DLC1_DATA_CHS/
      #     dlc2 → DLC2_DATA_CHS/fonts.xml   + DLC2_DATA_CHS/
      #       ★ DLC2 的源 fonts.xml 就用译文目录里那份：它与游戏原版
      #         fonts.xml 逐字节相同（实测），而 DLC2_DATA/ 是第三方原版数据、
      #         按 .gitignore 不入库。
      #   产出布局 <out>/<key>/{data/if/fonts/*, hta_chs_cjk.bin}，
      #   与 build_release.py 的 --fonts 期望一致。
      - name: 烘焙三套字库
        run: |
          set -euo pipefail
          # WINEDEBUG 与 HTA_TEXCONV 已在「安装 wine」那步写进 $GITHUB_ENV，
          # 这里不必再 export（build_cjk.py 通过 HTA_TEXCONV 调 wine 跑 texconv）
          bake() {
            local key="$1" fonts="$2" text="$3"
            echo "=================================================="
            echo "[$key] 源=$fonts  译文=$text"
            echo "=================================================="
            python fontgen/build_cjk.py \
              --src-fonts "$fonts" --text-dir "$text" \
              --out "baked_fonts/$key"
          }
          bake base Original_DATA/data/if/fonts/fonts.xml Original_DATA_CHS
          bake dlc1 DLC1_DATA/data/if/fonts/fonts.xml     DLC1_DATA_CHS
          bake dlc2 DLC2_DATA_CHS/data/if/fonts/fonts.xml DLC2_DATA_CHS
          echo "── 烘焙产物概览 ──"
          for k in base dlc1 dlc2; do
            n=$(ls baked_fonts/$k/data/if/fonts/cjk_*.dds | wc -l)
            b=$(wc -c < baked_fonts/$k/hta_chs_cjk.bin)
            echo "  $k: $n 张图集, bin=$b B"
          done

      # ── 装配三个发布包 ──────────────────────────────────────────────
      - name: 装配三个发布包
        run: |
          set -euo pipefail
          python tools/release/build_release.py \
            --out release --fonts baked_fonts \
            --date "$(TZ=Asia/Shanghai date +%Y%m%d)"

      # ── 校验产物结构 ────────────────────────────────────────────────
      #   独立于装配脚本再核一遍（见 verify_release.py 的说明）：该有的在不在、
      #   体积指纹对不对、fonts.xml 声明与磁盘是否一致、zip 内中文条目名有没有
      #   置 UTF-8 标志位（否则 Windows 解压乱码）。
      - name: 校验产物结构
        run: python3 tools/release/verify_release.py release

      # ── 上传三个 artifact ───────────────────────────────────────────
      - name: "上传 本体包 (artifact: hta-base)"
        uses: actions/upload-artifact@v4
        with:
          name: hta-base
          path: release/燃烧飞车_末日浩劫_简体中文汉化_*.zip
          if-no-files-found: error
          retention-days: 30

      - name: "上传 部落崛起包 (artifact: hta-dlc1)"
        uses: actions/upload-artifact@v4
        with:
          name: hta-dlc1
          path: release/燃烧飞车_末日浩劫_部落崛起_简体中文汉化_*.zip
          if-no-files-found: error
          retention-days: 30

      - name: "上传 街机版包 (artifact: hta-dlc2)"
        uses: actions/upload-artifact@v4
        with:
          name: hta-dlc2
          path: release/燃烧飞车_末日浩劫_街机版_简体中文汉化_*.zip
          if-no-files-found: error
          retention-days: 30

  # push 到 master/main 时，在同一 run 内由 gh CLI 建 tag 并发布 Release。
  # ★ 不用「tag push 重触发 workflow」：GITHUB_TOKEN 推的 tag 不触发 on:push
  #   （GitHub 防循环机制），那样 package job 会永远 skipped、Release 无附件。
  publish:
    name: 发布 Release（push 时自动按日期-时间打 tag）
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # ★ 必须检出：要用 git 建 tag、以及 release_notes 里算 commit 范围
      - name: 检出仓库（git tag 需要）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 下载三个 artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 校验三个包齐全
        run: |
          set -euo pipefail
          for d in hta-base hta-dlc1 hta-dlc2; do
            n=$(ls -1 "dist/$d"/*.zip 2>/dev/null | wc -l || true)
            if [ "$n" -ne 1 ]; then
              echo "!! dist/$d 期望 1 个 zip，实际 $n 个" >&2; exit 1
            fi
          done
          echo "✓ 三个包齐全（内部为中文名 zip；附件将以 ASCII 名上传）"

      - name: 计算日期-时间 tag
        id: tag
        run: |
          set -euo pipefail
          tag="$(TZ=Asia/Shanghai date +%Y-%m-%d-%H-%M-%S)"
          # 极小概率同秒重复推送：tag 已存在则追加运行号
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag="${tag}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "将使用 tag: $tag"

      - name: 建 git tag 并推送
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
          echo "✓ 已建 tag: $tag"

      # Release 说明三要素：
      #   1) 本次构建相关的提交记录（自上次 Release 起）
      #   2) 三个 ASCII 附件名 ↔ 中文原名对照表（附件名不能中文）
      #   3) 必读说明全文（与包内 必读说明.txt 同源，玩家不下载也能看）
      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          slug="${{ github.repository }}"
          repo_url="https://github.com/$slug"

          # ── 提交记录范围：上次 Release 的 commit sha 起 ──
          #   ★ 不用 git log <上次tag>..HEAD —— actions/checkout 默认不拉 tag
          #     对象（fetch-depth:0 只拉分支历史），会报 unknown revision。
          #     改用 release 的 commit.sha，且 .commit.sha 对 tag 建的 release
          #     实测可能为空，故退一路查 tag ref。
          latest="$(gh api "repos/$slug/releases/latest" 2>/dev/null || true)"
          prev_tag="$(printf '%s' "$latest" | jq -r '.tag_name // empty' 2>/dev/null || true)"
          prev_sha="$(printf '%s' "$latest" | jq -r '.commit.sha // empty' 2>/dev/null || true)"
          if [ -z "$prev_sha" ] && [ -n "$prev_tag" ]; then
            prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.sha // empty' 2>/dev/null || true)"
            if [ "$(git cat-file -t "$prev_sha" 2>/dev/null || true)" = "tag" ]; then
              prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.object.sha // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            base="$prev_sha"; base_label="$prev_tag"
            echo "上一次 Release：$prev_tag（$prev_sha）"
          else
            base="$(git rev-list --max-parents=0 HEAD)"; base_label="首个提交"
            echo "无可用历史 Release，以首个提交为基准：$base"
          fi

          : > commits.md
          git log --no-merges --max-count=60 --pretty=format:'%H%x09%s' "$base..HEAD" \
            | while IFS=$'\t' read -r h s; do
                if [ -z "$h" ]; then continue; fi
                printf -- '- [`%s`](%s/commit/%s) %s\n' "${h:0:7}" "$repo_url" "$h" "$s" >> commits.md
              done
          n=$(grep -c '^- ' commits.md || true)
          echo "本次提交记录：$n 条（基准 $base）"

          cat > release_notes.md <<'EOF'
          ## 《燃烧飞车：末日浩劫》系列 简体中文汉化包 · `@@TAG@@`

          三个游戏各一套包（**补丁锚点地址不同，不可混用**）。下载你正在玩的那一版，
          **把包内全部文件解压覆盖到游戏根目录**；安装与卸载方法见下方必读说明。

          > ⚠️ GitHub Release 附件名不支持中文（经 API 上传会被静默破坏成 `_._._` 这类），
          > 故附件用英文名；解压后内部文件名与目录名均为中文，**不影响使用**。
          > 下表「英文附件名 ↔ 中文原名」一一对应，按你的游戏版本选一个下载即可。
          EOF

          {
            echo
            echo "### 🧾 本次更新（自 \`$base_label\` 起，共 ${n} 条提交）"
            echo
            if [ -s commits.md ]; then cat commits.md; else echo "(本次构建无新增提交)"; fi
          } >> release_notes.md

          cat >> release_notes.md <<'EOF'

          ### 📦 下载（3 个补丁包，均解压到游戏根目录）

          | 英文附件名 | 对应中文原名 | 适用游戏 |
          |---|---|---|
          | `HTA-Base-CHS-Patch-@@TAG@@.zip` | 燃烧飞车_末日浩劫_简体中文汉化 | 本体 `hta.exe` |
          | `HTA-DLC1-RiseOfClans-CHS-Patch-@@TAG@@.zip` | 燃烧飞车_末日浩劫_部落崛起_简体中文汉化 | 资料片 `Meridian113.exe` |
          | `HTA-DLC2-Arcade-CHS-Patch-@@TAG@@.zip` | 燃烧飞车_末日浩劫_街机版_简体中文汉化 | 街机版 `emarcade.exe` |

          ### ⚠️ 安装前必读

          1. **先运行包内的「【必装】扩展32位游戏内存分配」bat**（等价于给 exe 打 LAA 补丁）
             —— 不打这个，进游戏会因内存不足崩溃。
          2. **部落崛起（DLC1）必须用包内的单核 bat 启动**，见必读说明第 11 条。
          3. 三个包**不要互相覆盖**，装错版本会导致启动即崩。
          EOF

          {
            echo
            echo "### 📖 必读说明（安装 / 卸载 / 已知问题）"
            echo
            if [ -f "dist/hta-base/必读说明.txt" ]; then
              echo "<details><summary>展开完整必读说明（与包内 必读说明.txt 一致）</summary>"
              echo
              echo "<pre>"
              tr -d '\r' < "dist/hta-base/必读说明.txt"
              echo "</pre>"
              echo
              echo "</details>"
            else
              echo "> ⚠️ 未找到必读说明，本次未附带。"
            fi
            echo
            echo "---"
            echo
            echo "源码仓库：<https://github.com/HaoJun0823/HardTruckApocalypse_CHINESE>　·　作者主页：<https://www.haojun0823.xyz/>"
          } >> release_notes.md

          sed -i "s/@@TAG@@/$tag/g" release_notes.md
          if grep -q '@@TAG@@' release_notes.md; then
            echo "!! 仍有未替换的 @@TAG@@" >&2; exit 1
          fi
          echo "── release_notes.md 生成完毕（$(wc -l < release_notes.md) 行）──"

      # 发布：建 release（取 upload_url）→ 用 ASCII 附件名逐个上传。
      # ★ GitHub 已废弃 api.github.com/.../releases/{id}/assets 端点（直传 404），
      #   必须用建 release 时返回的 upload_url（指向 uploads.github.com）。
      # ★ body 必须用 -F（不是 -f）：-f 不展开 @file，会把 "@release_notes.md"
      #   原文当成正文。
      - name: 创建 Release 并上传三个 ASCII 名 zip
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          slug="${{ github.repository }}"

          if [ ! -f release_notes.md ]; then
            echo "!! 未找到 release_notes.md" >&2; exit 1
          fi
          for sec in "HTA-Base-CHS-Patch" "HTA-DLC1-RiseOfClans-CHS-Patch" \
                     "HTA-DLC2-Arcade-CHS-Patch" "必读说明"; do
            if ! grep -qF "$sec" release_notes.md; then
              echo "!! release_notes.md 缺少段落「$sec」" >&2; exit 1
            fi
          done
          echo "✓ release_notes.md 预检通过"

          REL_JSON=$(gh api -X POST "repos/$slug/releases" \
            -f "tag_name=$tag" -f "name=$tag" \
            -F "body=@release_notes.md" -F "draft=false")
          if [ "$(jq -r .body <<<"$REL_JSON")" = "@release_notes.md" ]; then
            echo "-F @file 未生效，回退：直接传正文字符串"
            REL_JSON=$(gh api -X POST "repos/$slug/releases" \
              -f "tag_name=$tag" -f "name=$tag" \
              -f "body=$(cat release_notes.md)" -F "draft=false")
          fi
          body="$(jq -r .body <<<"$REL_JSON")"
          body_head="${body%%$'\n'*}"
          if [ -z "$body_head" ] || [[ "$body_head" != "## 《燃烧飞车：末日浩劫》系列 简体中文汉化包"* ]]; then
            echo "!! Release body 异常（首行=[$body_head]）" >&2; exit 1
          fi
          echo "✓ Release body 已写入（首行：${body_head}…）"

          UPLOAD_URL=$(echo "$REL_JSON" | jq -r .upload_url)
          BASE="${UPLOAD_URL%%\{*}"

          upload_one() {
            local src="$1" ascii="$2"
            echo "⬆️ 上传 $ascii"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/zip" \
              -H "Accept: application/vnd.github+json" \
              --data-binary "@$src" \
              "${BASE}?name=${ascii}" | jq -r '.name'
            echo "✅ $ascii"
          }
          upload_one "$(ls dist/hta-base/*.zip)"  "HTA-Base-CHS-Patch-${tag}.zip"
          upload_one "$(ls dist/hta-dlc1/*.zip)"  "HTA-DLC1-RiseOfClans-CHS-Patch-${tag}.zip"
          upload_one "$(ls dist/hta-dlc2/*.zip)"  "HTA-DLC2-Arcade-CHS-Patch-${tag}.zip"
          echo "✅ 已发布 Release: $tag"
